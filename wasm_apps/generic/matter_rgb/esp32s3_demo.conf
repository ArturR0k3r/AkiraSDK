#
# Enables the Matter accessory path with the IN-FIRMWARE MOCK co-processor so
# the whole flow can be exercised on the board WITHOUT a real esp-matter
# co-processor: on start the mock injects an OnOff/On command, so the RGB LED
# (GPIO4/5/6, same pins as rgb_controller) lights up.
#
# TEST / DEMO ONLY — CONFIG_AKIRA_MATTER_COPROC_MOCK must NOT ship in
# production (it hijacks the co-processor UART with a fake responder).
#
# Build:
#   west build -p -b esp32s3_super_mini/esp32s3/procpu . \
#     -- -DEXTRA_CONF_FILE=AkiraSDK/wasm_apps/generic/matter_rgb/esp32s3_demo.conf
#
# Then flash and install matter_rgb.wasm via the normal app-deploy flow
# (SD / HTTP / BLE), or run `matter pair` in the shell to print the QR code.

CONFIG_AKIRA_MATTER=y
CONFIG_AKIRA_MATTER_COPROC_UART=y
CONFIG_AKIRA_WASM_MATTER=y
CONFIG_AKIRA_MATTER_ACCESSORY=y
CONFIG_AKIRA_MATTER_COPROC_MOCK=y

# The super_mini's internal DRAM is ~99.6% full at baseline. Reclaim ~2KB of
# kernel heap (still above the ~80KB BT floor) to fit the Matter accessory
# stack + mock. A real (non-mock) deployment with a co-processor has a smaller
# footprint and may not need this.
CONFIG_HEAP_MEM_POOL_SIZE=83488
