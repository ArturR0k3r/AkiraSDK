# ha_rgb demo build for ESP32-S3 super_mini (the PWM RGB board).
#
# Enables the MQTT client + WASM MQTT/HA API so the ha_rgb app can expose the
# RGB LED (GPIO4/5/6) to Home Assistant. The S3's WiFi talks straight to your
# MQTT broker — no co-processor needed.
#
# Build:
#   west build -p -b esp32s3_super_mini/esp32s3/procpu . \
#     -- -DEXTRA_CONF_FILE=AkiraSDK/wasm_apps/generic/ha_rgb/esp32s3_demo.conf
#
# Then flash, set the broker + connect from the shell:
#   mqtt set <broker-host> 1883 <user> <pass>
#   mqtt connect
# ...install and run ha_rgb; it auto-appears in Home Assistant.

CONFIG_AKIRA_MQTT=y
CONFIG_AKIRA_WASM_MQTT=y

# The super_mini's internal DRAM is ~99.6% full at baseline; the MQTT client +
# Zephyr MQTT lib add several KB. Trim the inbound queue and reclaim kernel
# heap (still above the ~80KB BT floor) to fit. A board with more free DRAM
# does not need these.
CONFIG_AKIRA_MQTT_RX_QUEUE_DEPTH=3
CONFIG_AKIRA_MQTT_THREAD_STACK_SIZE=2560
CONFIG_HEAP_MEM_POOL_SIZE=81408
